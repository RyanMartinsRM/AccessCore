{% extends "base.html" %}

{% block title %}Editar Usuário - AccessCore{% endblock %}

{% block content %}

<div class="card" style="
    background-color: var(--bg-card); 
    color: var(--text-primary);
    max-width: 800px; 
    margin: 0 auto; 
    padding: 30px; 
    border-radius: 8px; 
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
        <h2 style="margin: 0;">Editar Usuário</h2>
        <a href="{{ url_for('usuarios') }}" style="color: var(--text-secondary); text-decoration: none;">← Voltar</a>
    </div>

    <form action="{{ url_for('editar_usuario', id=usuario.id) }}" method="POST">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            
            <div style="grid-column: span 2;">
                <label style="display: block; margin-bottom: 5px; font-weight: 500;">Nome Completo</label>
                <input type="text" name="nome_completo" class="form-control" value="{{ usuario.nome_completo }}" required style="width: 100%;">
            </div>

            <div>
                <label style="display: block; margin-bottom: 5px; font-weight: 500;">Documento (CPF/RG)</label>
                <input type="text" name="documento" class="form-control" value="{{ usuario.documento or '' }}" style="width: 100%;">
            </div>

            <div>
                <label style="display: block; margin-bottom: 5px; font-weight: 500;">Tipo de Usuário</label>
                <select name="tipo_usuario" class="form-control" style="width: 100%;">
                    {% for tipo in tipos %}
                        <option value="{{ tipo }}" {% if usuario.tipo_usuario == tipo %}selected{% endif %}>{{ tipo }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="grid-column: span 2;">
                <label style="display: block; margin-bottom: 5px; font-weight: 500;">Nível de Acesso</label>
                <select name="nivel_acesso_id" class="form-control" style="width: 100%;">
                    <option value="">-- Sem Nível de Acesso (Bloqueado) --</option>
                    {% for nivel in niveis_acesso %}
                        <option value="{{ nivel.id }}" {% if usuario.nivel_acesso_id == nivel.id %}selected{% endif %}>
                            {{ nivel.nome }}
                        </option>
                    {% endfor %}
                </select>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px;">
                    * Define quais portas e horários este usuário pode acessar.
                </p>
            </div>

        </div>

        <div style="text-align: right; margin-top: 30px;">
            <a href="{{ url_for('usuarios') }}" style="margin-right: 15px; color: var(--text-secondary); text-decoration: none;">Cancelar</a>
            <button type="submit" class="btn-primary" style="background-color: #0078d4; color: white; border: none; padding: 10px 30px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                Salvar Alterações
            </button>
        </div>

    </form>
</div>

{% endblock %}
